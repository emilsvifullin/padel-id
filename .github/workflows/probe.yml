name: probe
on:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/probe.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, macos-27, macos-26-xlarge]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - run: |
          sw_vers
          ls /Applications | grep -i xcode
          xcodebuild -version
          xcodebuild -showsdks
          xcrun simctl list runtimes
          xcrun simctl list devicetypes | grep -i iphone
          xcrun simctl list devices available | grep -i iphone | head -40
