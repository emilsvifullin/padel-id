name: iOS

on:
  push:
    branches: [main, "claude/**", "codex/**"]
    paths:
      - "ios/**"
      - "scripts/ios/**"
      - ".github/actions/setup-ios/**"
      - ".github/workflows/ios.yml"
  pull_request:
    branches: [main]
    paths:
      - "ios/**"
      - "scripts/ios/**"
      - ".github/actions/setup-ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:
    inputs:
      only_testing:
        description: "Test identifier for a targeted run, e.g. PadelIDUITests/HomeUITests/testHomeAndAppearanceAccessibility"
        default: PadelIDUITests

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: macos-26
    # Hosted UI automation can take about an hour; leave time to export the
    # result bundle even when the bounded UI step times out.
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iPhone 17 Pro · light · unit + UI
            slug: 17pro-light
            device: iPhone 17 Pro
            appearance: light
            content_size: large
            unit: true
          - name: iPhone 17 Pro Max · dark · UI
            slug: 17promax-dark
            device: iPhone 17 Pro Max
            appearance: dark
            content_size: large
            unit: false
          - name: iPhone 16e · light · accessibility text · UI
            slug: 16e-ax
            device: iPhone 16e
            appearance: light
            content_size: accessibility-extra-large
            unit: false
          - name: iPhone 17 Pro · dark · large text · UI
            slug: 17pro-dark-xxxl
            device: iPhone 17 Pro
            appearance: dark
            content_size: extra-extra-extra-large
            unit: false
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-ios

      - name: Check API and push build configuration gates
        run: |
          python3 scripts/ios/test-api-url.py
          python3 scripts/ios/test-push-config.py

      - name: Boot the simulator
        id: sim
        run: echo "udid=$(scripts/ios/simulator.sh '${{ matrix.device }}' '${{ matrix.appearance }}' '${{ matrix.content_size }}')" >> "$GITHUB_OUTPUT"

      - name: Build for testing
        working-directory: ios
        run: |
          if ! xcodebuild build-for-testing \
            -project PadelID.xcodeproj -scheme PadelID -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }},arch=arm64" \
            -derivedDataPath "$RUNNER_TEMP/dd" > "$RUNNER_TEMP/build.log" 2>&1; then
            grep -E "error:" "$RUNNER_TEMP/build.log" | sort -u | head -300
            tail -40 "$RUNNER_TEMP/build.log"
            exit 1
          fi
          echo "Warnings:"
          grep -E "warning:" "$RUNNER_TEMP/build.log" | grep -v "appintentsmetadataprocessor" | sort -u | head -200 || true

      - name: Unit tests
        if: matrix.unit && (github.event_name != 'workflow_dispatch' || inputs.only_testing == 'PadelIDUITests')
        timeout-minutes: 15
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project PadelID.xcodeproj -scheme PadelID -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }},arch=arm64" \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            -parallel-testing-enabled NO \
            -maximum-concurrent-test-simulator-destinations 1 \
            -only-testing:PadelIDTests \
            -resultBundlePath "$RUNNER_TEMP/unit.xcresult" \
            2>&1 | tee "$RUNNER_TEMP/unit.log"

      - name: UI tests
        timeout-minutes: 85
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project PadelID.xcodeproj -scheme PadelID -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }},arch=arm64" \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            -parallel-testing-enabled NO \
            -maximum-concurrent-test-simulator-destinations 1 \
            -only-testing:"${{ inputs.only_testing || 'PadelIDUITests' }}" \
            -resultBundlePath "$RUNNER_TEMP/ui.xcresult" \
            2>&1 | tee "$RUNNER_TEMP/ui.log"

      - name: Test summary
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/screenshots"
          summary="$RUNNER_TEMP/screenshots/${{ matrix.slug }}-summary.txt"
          : > "$summary"
          for r in unit ui; do
            if [ -f "$RUNNER_TEMP/$r.xcresult/Info.plist" ]; then
              echo "== $r" | tee -a "$summary"
              xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/$r.xcresult" --compact \
                | python3 -c 'import json,sys; s=json.load(sys.stdin); print({k: s.get(k) for k in ("result","totalTestCount","passedTests","failedTests","skippedTests")}); [print("FAILED:", f.get("testName"), "-", f.get("failureText")) for f in s.get("testFailures", [])]' \
                | tee -a "$summary"
              python3 scripts/ios/failed-activities.py "$RUNNER_TEMP/$r.xcresult" >> "$summary" || true
            elif [ -d "$RUNNER_TEMP/$r.xcresult" ]; then
              echo "== $r: incomplete result bundle (test execution interrupted)" | tee -a "$summary"
            fi
          done

      - name: Export screenshots
        if: always()
        run: python3 scripts/ios/export-screenshots.py "$RUNNER_TEMP/ui.xcresult" "$RUNNER_TEMP/screenshots" "${{ matrix.slug }}-"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshots-${{ matrix.slug }}
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: ignore
          retention-days: 14

      - uses: actions/upload-artifact@v7
        if: always() && (failure() || cancelled())
        with:
          name: xcresult-${{ matrix.slug }}
          path: |
            ${{ runner.temp }}/unit.xcresult
            ${{ runner.temp }}/ui.xcresult
            ${{ runner.temp }}/build.log
            ${{ runner.temp }}/unit.log
            ${{ runner.temp }}/ui.log
          if-no-files-found: ignore
          retention-days: 7

  # Screenshots for design review, published as one rolling prerelease asset
  # (never on main; removed before the final release).
  screenshots:
    name: Publish screenshots for review
    needs: test
    if: always() && github.event_name == 'push' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: screenshots-*
          path: screenshots
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          count=$(find screenshots -type f 2>/dev/null | wc -l | tr -d ' ')
          echo "Screenshots: $count"
          [ "$count" -gt 0 ] || exit 0
          (cd screenshots && zip -q -r ../screenshots.zip .)
          gh release delete ui-screenshots --yes --cleanup-tag 2>/dev/null || true
          gh release create ui-screenshots screenshots.zip --prerelease --target "$GITHUB_SHA" \
            --title "UI screenshots (CI review)" \
            --notes "Generated by the iOS workflow for ${GITHUB_SHA} to review the interface. Not a release."
