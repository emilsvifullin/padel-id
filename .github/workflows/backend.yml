name: Backend

on:
  push:
    branches: [main, "claude/**", "codex/**"]
    paths:
      - "supabase/**"
      - "server/**"
      - "scripts/db/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "supabase/**"
      - "server/**"
      - "scripts/db/**"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-unit:
    name: API gateway — typecheck & unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.28.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run build
      - run: pnpm test
      - name: Check isolated read-only network probe
        run: node --test deploy/netlify/probe.test.mjs
      - run: pnpm run build:edge
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.7
      - name: Check generated Edge gateway and run adapter tests
        working-directory: .
        run: |
          deno check --frozen --config supabase/functions/gateway/deno.json supabase/functions/gateway/index.ts
          deno test --frozen --config supabase/functions/gateway/deno.json supabase/functions/gateway/adapter_test.ts

  stack:
    name: Database & end-to-end (Supabase stack)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: 2.117.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.28.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml

      - name: Build generated Edge gateway
        working-directory: server
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
          pnpm run build:edge

      - name: Start Supabase (applies all migrations from scratch)
        run: supabase start -x studio,imgproxy,mailpit,realtime,vector,logflare,supavisor

      - name: Database test-suite (schema, rating engine, RLS, privileges)
        env:
          PGHOST: 127.0.0.1
          PGPORT: "54322"
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: ./scripts/db/run-tests.sh

      - name: Database concurrency regressions (independent connections)
        env:
          PGHOST: 127.0.0.1
          PGPORT: "54322"
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: python3 scripts/db/run-concurrency-tests.py

      - name: Social concurrency regressions (independent connections)
        env:
          PGHOST: 127.0.0.1
          PGPORT: "54322"
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: python3 scripts/db/run-social-concurrency-tests.py

      - name: Event concurrency regressions (independent connections)
        env:
          PGHOST: 127.0.0.1
          PGPORT: "54322"
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
          PADELID_DISPOSABLE_DB: "1"
        run: python3 scripts/db/run-event-concurrency-tests.py

      - name: Club concurrency regressions (independent connections)
        env:
          PGHOST: 127.0.0.1
          PGPORT: "54322"
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
          PADELID_DISPOSABLE_DB: "1"
        run: python3 scripts/db/run-clubs-concurrency-tests.py

      - name: Push concurrency regressions (independent connections)
        env:
          PGHOST: 127.0.0.1
          PGPORT: "54322"
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
          PADELID_DISPOSABLE_DB: "1"
        run: python3 scripts/db/run-push-concurrency-tests.py

      - name: Database linter
        run: supabase db lint --level warning --fail-on error

      - name: Configure gateway secret
        env:
          PGHOST: 127.0.0.1
          PGPORT: "54322"
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: |
          SECRET=$(openssl rand -hex 32)
          echo "::add-mask::$SECRET"
          echo "GATEWAY_SECRET=$SECRET" >> "$GITHUB_ENV"
          psql -v ON_ERROR_STOP=1 -c "insert into private.bff_secret (secret_hash) values (extensions.digest('$SECRET', 'sha256')) on conflict (id) do update set secret_hash = excluded.secret_hash"

      - name: Serve edge functions
        run: |
          umask 077
          PADEL_EDGE_ENV="$RUNNER_TEMP/padel-edge.env"
          printf 'PADELID_GATEWAY_SECRET=%s\nPADELID_SIGNUPS_PER_HOUR=100\n' "$GATEWAY_SECRET" > "$PADEL_EDGE_ENV"
          nohup supabase functions serve --env-file "$PADEL_EDGE_ENV" > functions.log 2>&1 &
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:54321/functions/v1/account -H 'content-type: application/json' -d '{}') || true
            if [ "$code" = "401" ]; then echo "account function ready"; exit 0; fi
            sleep 2
          done
          cat functions.log; exit 1

      - name: Edge Runtime gateway health and anonymous-access regression
        run: |
          curl -fsS http://127.0.0.1:54321/functions/v1/gateway/v1/health?deep=1 | python3 -c 'import json,sys; body=json.load(sys.stdin); assert body["status"]=="ok" and body["database"]=="ok"'
          code=$(curl -sS -o edge-anonymous.json -w '%{http_code}' http://127.0.0.1:54321/functions/v1/gateway/v1/me)
          test "$code" = 401
          python3 -c 'import json; assert json.load(open("edge-anonymous.json"))["error"]["code"]=="not_authenticated"'

      - name: Start API gateway
        working-directory: server
        run: |
          eval "$(supabase status -o env | sed 's/^/export SB_/')"
          export SUPABASE_URL="$SB_API_URL"
          export SUPABASE_PUBLISHABLE_KEY="${SB_PUBLISHABLE_KEY:-$SB_ANON_KEY}"
          export PADELID_GATEWAY_SECRET="$GATEWAY_SECRET"
          export PADELID_SIGNUPS_PER_HOUR=100
          nohup node dist/dev-server.js > ../gateway.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8787/v1/health && exit 0
            sleep 1
          done
          cat ../gateway.log; exit 1

      - name: End-to-end API tests
        working-directory: server
        env:
          E2E_API_URL: http://127.0.0.1:8787
          E2E_MODE: full
        run: |
          eval "$(supabase status -o env | sed 's/^/export SB_/')"
          export E2E_SUPABASE_URL="$SB_API_URL"
          export E2E_SUPABASE_PUBLISHABLE_KEY="${SB_PUBLISHABLE_KEY:-$SB_ANON_KEY}"
          pnpm run test:e2e

      - name: Logs on failure
        if: failure()
        run: |
          echo "--- gateway"; cat gateway.log || true
          echo "--- functions"; cat functions.log || true
