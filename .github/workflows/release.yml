name: Release

# Builds the standalone Release configuration of Padel ID, packages it as an
# unsigned PadelID.ipa for SideStore / iLoader (they sign it with the user's
# own Apple ID on install) and, when requested, publishes a GitHub Release.

on:
  push:
    # Every push to main (and to working branches) builds and verifies the
    # IPA; publishing a GitHub Release is a separate, manual step.
    branches: [main, "claude/**"]
    paths:
      - "ios/**"
      - "scripts/ios/**"
      - ".github/actions/setup-ios/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a GitHub Release for the version in ios/project.yml (main only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build PadelID.ipa
    runs-on: macos-26
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.version.outputs.build }}
    steps:
      - uses: actions/checkout@v5

      - name: Read the version
        id: version
        run: |
          version=$(sed -n 's/^ *MARKETING_VERSION: *"\(.*\)"/\1/p' ios/project.yml)
          build=$(sed -n 's/^ *CURRENT_PROJECT_VERSION: *"\(.*\)"/\1/p' ios/project.yml)
          [ -n "$version" ] && [ -n "$build" ]
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "Padel ID $version ($build)"

      - uses: ./.github/actions/setup-ios

      - name: Unit tests
        working-directory: ios
        run: |
          set -o pipefail
          udid=$(../scripts/ios/simulator.sh "iPhone 17 Pro" light large)
          xcodebuild test \
            -project PadelID.xcodeproj -scheme PadelID -configuration Debug \
            -destination "id=$udid" -derivedDataPath "$RUNNER_TEMP/dd-test" \
            -only-testing:PadelIDTests | tail -40

      - name: Archive the Release configuration
        working-directory: ios
        run: |
          if ! xcodebuild archive \
            -project PadelID.xcodeproj -scheme PadelID -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/PadelID.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/dd-release" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            > "$RUNNER_TEMP/archive.log" 2>&1; then
            grep -E "error:" "$RUNNER_TEMP/archive.log" | sort -u | head -200
            tail -40 "$RUNNER_TEMP/archive.log"
            exit 1
          fi
          grep -E "warning:" "$RUNNER_TEMP/archive.log" | grep -v "appintentsmetadataprocessor" | sort -u | head -100 || true

      - name: Package PadelID.ipa
        run: |
          stage="$RUNNER_TEMP/ipa"
          mkdir -p "$stage/Payload" dist
          cp -R "$RUNNER_TEMP/PadelID.xcarchive/Products/Applications/PadelID.app" "$stage/Payload/"
          (cd "$stage" && zip -qry "$GITHUB_WORKSPACE/dist/PadelID.ipa" Payload)
          (cd dist && shasum -a 256 PadelID.ipa > PadelID.ipa.sha256 && cat PadelID.ipa.sha256)

      - name: Verify PadelID.ipa
        run: scripts/ios/verify-ipa.sh dist/PadelID.ipa "${{ steps.version.outputs.version }}"

      # The IPA itself, downloadable as-is (not zipped) from the run page.
      - uses: actions/upload-artifact@v7
        with:
          path: dist/PadelID.ipa
          archive: false
          if-no-files-found: error
          retention-days: 90

      # IPA plus checksum for the publish job.
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ steps.version.outputs.version }}
          path: |
            dist/PadelID.ipa
            dist/PadelID.ipa.sha256
          if-no-files-found: error
          retention-days: 90

  publish:
    name: Publish GitHub Release
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v8
        with:
          name: release-${{ needs.build.outputs.version }}
          path: dist

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; bump MARKETING_VERSION to publish a new one."
            exit 1
          fi
          notes="docs/release-notes/$VERSION.md"
          [ -f "$notes" ] || { echo "Missing $notes"; exit 1; }
          (cd dist && shasum -a 256 -c PadelID.ipa.sha256)
          gh release create "$tag" dist/PadelID.ipa dist/PadelID.ipa.sha256 \
            --target "$GITHUB_SHA" --title "Padel ID $VERSION" --notes-file "$notes" --latest
