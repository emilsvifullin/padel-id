name: Set up the iOS toolchain
description: Selects Xcode, installs a checksum-pinned XcodeGen and generates the Xcode project.

inputs:
  xcode:
    description: Xcode version installed on the runner image.
    default: "26.6"

runs:
  using: composite
  steps:
    - name: Select Xcode
      shell: bash
      run: |
        sudo xcode-select -s "/Applications/Xcode_${{ inputs.xcode }}.app/Contents/Developer"
        xcodebuild -version

    - name: Install XcodeGen 2.45.4
      shell: bash
      run: |
        dir="$RUNNER_TEMP/xcodegen"
        mkdir -p "$dir"
        curl -fsSL --retry 3 -o "$dir/xcodegen.zip" \
          https://github.com/yonaskolb/XcodeGen/releases/download/2.45.4/xcodegen.zip
        echo "090ec29491aad50aec10631bf6e62253fed733c50f3aab0f5ffc86bc170bdbef  $dir/xcodegen.zip" | shasum -a 256 -c -
        unzip -q "$dir/xcodegen.zip" -d "$dir"
        echo "$dir/xcodegen/bin" >> "$GITHUB_PATH"

    - name: Generate the Xcode project
      shell: bash
      working-directory: ios
      run: |
        xcodegen --version
        xcodegen generate --spec project.yml
