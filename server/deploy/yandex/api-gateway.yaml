# Optional front for the function when a stable hostname or a custom domain is
# needed. Replace both placeholders before `yc serverless api-gateway create`.
openapi: 3.0.0
info:
  title: Padel ID ingress
  version: 1.0.0
paths:
  /{proxy+}:
    x-yc-apigateway-any-method:
      parameters:
        - name: proxy
          in: path
          required: true
          schema:
            type: string
      x-yc-apigateway-integration:
        type: cloud_functions
        function_id: FUNCTION_ID
        service_account_id: SERVICE_ACCOUNT_ID
        payload_format_version: "1.0"
